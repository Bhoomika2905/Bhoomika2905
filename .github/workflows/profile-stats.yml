name: Profile Stats Cards

on:
  schedule:
    - cron: "17 6 * * *"   # refresh daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-stats.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
